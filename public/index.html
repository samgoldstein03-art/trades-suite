<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0F172A" />
    <meta
      name="description"
      content="Your customers, quotes and review requests. A clear view of the next job."
    />
    <title>Overview — Tradesuite</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#dashboard" aria-label="Tradesuite home"
          ><span class="brand-mark">t<span>↗</span></span
          ><span>tradesuite<span class="brand-dot">.</span></span></a
        >
        <div class="business-switch">
          <div id="business-identity" class="business-identity"></div>
          <label class="sr-only" for="business-select">Your business</label>
          <select id="business-select" aria-label="Choose business">
            <option>Loading…</option></select
          ><button class="text-button add-business" data-action="add-business">
            + Add a business
          </button>
        </div>
        <nav aria-label="Main navigation" id="main-nav"></nav>
        <div class="sidebar-bottom">
          <div class="admin-account">
            <span class="avatar small">A</span
            ><span><b>Your workspace</b><small>Admin access</small></span
            ><span class="online-dot"></span>
          </div>
        </div>
      </aside>
      <div class="main-shell">
        <header class="topbar">
          <div class="breadcrumb">
            Your workspace <span>/</span> <b id="page-name">Overview</b>
          </div>
          <div class="topbar-right">
            <span id="mode-label" class="mode-label">Connecting…</span
            ><span class="avatar tiny">A</span>
          </div>
        </header>
        <div id="public-demo-notice" class="public-demo-notice" hidden></div>
        <main id="main" tabindex="-1">
          <div class="loading-skeleton" role="status" aria-label="Loading your workspace">
            <span class="skeleton skeleton-heading" aria-hidden="true"></span>
            <div class="kpi-grid" aria-hidden="true">
              <div class="kpi-card"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-number"></span><span class="skeleton skeleton-line short"></span></div>
              <div class="kpi-card"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-number"></span><span class="skeleton skeleton-line short"></span></div>
              <div class="kpi-card"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-number"></span><span class="skeleton skeleton-line short"></span></div>
              <div class="kpi-card"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-number"></span><span class="skeleton skeleton-line short"></span></div>
            </div>
            <div class="panel skeleton-panel" aria-hidden="true"><span class="skeleton skeleton-line short"></span><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-line"></span></div>
            <span class="sr-only">Loading your workspace…</span>
          </div>
        </main>
        <footer class="page-footer">
          <span>A clear view of your next job.</span
          ><span>Tradesuite · Reviews & quotes</span>
        </footer>
      </div>
    </div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
